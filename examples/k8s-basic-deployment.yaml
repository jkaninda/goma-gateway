## *************** Goma Gateway basic deployment with Basic Auth and Rate Limiting *********
## ************* Goma Gateway ConfigMap *********
apiVersion: v1
kind: ConfigMap
metadata:
  name: goma-config
data:
  config.yaml: |
    version: 2
    gateway:
      timeouts:
        write: 30
        read: 30
        idle: 30
      log:
        level: info
      routes:
        - name: api-example
          path: /
          target: http://api-example:8080
          middlewares: ["rate-limit","basic-auth"]
    middlewares:
      - name: rate-limit
        type: rateLimit
        rule:
          unit: minute
          requestsPerUnit: 20
          banAfter: 5
          banDuration: 5m
      - name: basic-auth
        type: basicAuth
        paths:
          - /admin
          - /docs
          - /openapi
        rule:
          realm: Restricted
          forwardUsername: true
          users:
            # Resolved from the environment at load time. Never commit a
            # working credential to a manifest: a hash published in an example
            # is a known password on every cluster that copies it.
            - username: admin
              password: ${GOMA_ADMIN_PASSWORD_HASH}
---
## ************ Goma Gateway Deployment *********
apiVersion: apps/v1
kind: Deployment
metadata:
  name: goma-gateway
spec:
  selector:
    matchLabels:
      app: goma-gateway
  template:
    metadata:
      labels:
        app: goma-gateway
    spec:
      containers:
        - name: goma-gateway
          image: jkaninda/goma-gateway
          command: ["/usr/local/bin/goma","-c","/etc/goma/config.yaml"]
          env:
            - name: GOMA_ADMIN_PASSWORD_HASH
              valueFrom:
                secretKeyRef:
                  name: goma-basic-auth
                  key: adminPasswordHash
          # The image runs as root by default so a configuration using ports 80
          # and 443 works out of the box. This example listens on the binary's
          # unprivileged default (8080), so it can run as uid 10001 — which
          # owns the config and certificate directories in the image. Drop this
          # block if you change the entrypoints to a port below 1024.
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              memory: "50Mi"
              cpu: "100m"
            limits:
              memory: "128Mi"
              cpu: "500m"
          ports:
            - containerPort: 8080
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 15
          volumeMounts:
            - name: config
              mountPath: /etc/goma
      volumes:
        - name: config
          configMap:
            name: goma-config
---
## ************ API Example Deployment *********
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-example
spec:
  selector:
    matchLabels:
      app: api-example
  template:
    metadata:
      labels:
        app: api-example
    spec:
      containers:
        - name: api-example
          image: jkaninda/okapi-example:1.0.2
          resources:
            requests:
              memory: "50Mi"
              cpu: "100m"
            limits:
              memory: "128Mi"
              cpu: "500m"
          ports:
            - containerPort: 8080
---
### ***** Services *******
apiVersion: v1
kind: Service
metadata:
  name: goma-gateway
spec:
  # type: LoadBalancer
  selector:
    app: goma-gateway
  ports:
    - port: 8080
      targetPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: api-example
spec:
  selector:
    app: api-example
  ports:
    - port: 8080
      targetPort: 8080
---
## ************ Basic Auth Secret *********
## Create with a hash you generated yourself, e.g.
##   htpasswd -nbBC 12 admin 'your-password' | cut -d: -f2
## then:
##   kubectl create secret generic goma-basic-auth \
##     --from-literal=adminPasswordHash='$2y$12$...'
apiVersion: v1
kind: Secret
metadata:
  name: goma-basic-auth
type: Opaque
stringData:
  adminPasswordHash: "REPLACE_ME_WITH_A_BCRYPT_HASH"
