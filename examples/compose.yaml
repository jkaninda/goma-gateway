services:
  gateway:
    image: jkaninda/goma-gateway:latest
    container_name: goma-gateway
    restart: unless-stopped
    env_file: .env
    ports:
      - "80:80"     # HTTP
      - "443:443"   # HTTPS

    # Runs as root by default, which is what lets it bind 80 and 443 directly.
    #
    # To run unprivileged instead: uncomment the block below, change the ports
    # above to "80:8080" and "443:8443", and point the healthcheck at
    # http://localhost:8080/healthz. uid 10001 cannot bind ports under 1024,
    # and it owns the config and certificate directories in the image.
    # Any volume left behind by an earlier root run needs chown -R 10001:10001.
    #user: "10001:10001"
    #environment:
    #  GOMA_ENTRYPOINT_WEB_ADDRESS: "[::]:8080"
    #  GOMA_ENTRYPOINT_WEB_SECURE_ADDRESS: "[::]:8443"

    volumes:
      # Core configuration
      - ./:/etc/goma

      # Let's Encrypt certificates
      - letsencrypt:/etc/letsencrypt
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost/healthz || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s

    networks:
      - web


# -----------------------------
# Networks
# -----------------------------
networks:
  web:
    external: false

# -----------------------------
# Volumes
# -----------------------------
volumes:
  letsencrypt: