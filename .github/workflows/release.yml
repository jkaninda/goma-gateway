name: Release
on:
  push:
    tags:
      - v0.**
jobs:
  docker:
    if: "!contains(github.ref, '-rc')"
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read
      # Required for cosign keyless signing.
      id-token: write
    steps:
      -
        name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4
      -
        name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4
      -
        name: Login to DockerHub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      -
        name: Get the tag name
        id: get_tag_name
        run: |
          # Extract tag name and remove "v" if present
          TAG_NAME="${GITHUB_REF#refs/tags/}"
          VERSION="${TAG_NAME#v}"
          echo "VERSION=${VERSION}" >> $GITHUB_ENV
          echo BUILD_TIME=$(date) >> ${GITHUB_ENV}
      -
        name: Build and push
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          push: true
          # SLSA provenance and an SBOM, attached to the image as attestations.
          provenance: mode=max
          sbom: true
          file: "./Dockerfile"
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          build-args: |
            appVersion=${{ env.VERSION }}
            buildTime=${{ env.BUILD_TIME }}
            gitCommit=${{ github.sha }}
          tags: |
            "${{vars.BUILDKIT_IMAGE}}:${{ env.VERSION }}"
            "${{vars.BUILDKIT_IMAGE}}:latest"
      # Keyless signing: the signature is bound to this workflow's OIDC
      # identity, so a released image can be traced to the run that built it.
      # Verify with:
      #   cosign verify <image> \
      #     --certificate-identity-regexp '^https://github.com/jkaninda/goma-gateway/' \
      #     --certificate-oidc-issuer https://token.actions.githubusercontent.com
      -
        name: Install cosign
        uses: sigstore/cosign-installer@d58896d6a1865668819e1d91763c7751a165e159 # v3.9.2
      -
        name: Sign the published image
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          IMAGE: ${{vars.BUILDKIT_IMAGE}}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"
