name: Release
on:
  push:
    tags:
      - v0.**
jobs:
  docker:
    if: "!contains(github.ref, '-rc')"
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read
      # Required for cosign keyless signing.
      id-token: write
    steps:
      -
        name: Set up QEMU
        uses: docker/setup-qemu-action@v4.2.0
      -
        name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.3.0
      -
        name: Login to DockerHub
        uses: docker/login-action@v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      -
        name: Get the tag name
        id: get_tag_name
        run: |
          # Extract tag name and remove "v" if present
          TAG_NAME="${GITHUB_REF#refs/tags/}"
          VERSION="${TAG_NAME#v}"
          echo "VERSION=${VERSION}" >> $GITHUB_ENV
          echo BUILD_TIME=$(date) >> ${GITHUB_ENV}
      -
        name: Build and push
        id: build
        uses: docker/build-push-action@v7.3.0
        with:
          push: true
          # SLSA provenance and an SBOM, attached to the image as attestations.
          provenance: mode=max
          sbom: true
          file: "./Dockerfile"
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          build-args: |
            appVersion=${{ env.VERSION }}
            buildTime=${{ env.BUILD_TIME }}
            gitCommit=${{ github.sha }}
          tags: |
            "${{vars.BUILDKIT_IMAGE}}:${{ env.VERSION }}"
            "${{vars.BUILDKIT_IMAGE}}:latest"
      # Keyless signing: the signature is bound to this workflow's OIDC
      # identity, so a released image can be traced to the run that built it.
      # Verify with:
      #   cosign verify <image> \
      #     --certificate-identity-regexp '^https://github.com/jkaninda/goma-gateway/' \
      #     --certificate-oidc-issuer https://token.actions.githubusercontent.com
      -
        name: Install cosign
        uses: sigstore/cosign-installer@v4.1.2
      -
        name: Sign the published image
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          IMAGE: ${{vars.BUILDKIT_IMAGE}}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"
