name: Deploy Documentation site to GitHub Pages

on:
  # Publish whenever the documentation changes on the default branch.
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - '.github/workflows/deploy-docs.yml'
  # Keep the manual trigger so a site rebuild can be forced from any branch.
  workflow_dispatch:
    inputs:
      branch:
        description: 'Git branch or tag to build the documentation site from'
        required: true
        default: 'main'
        type: string

permissions:
  contents: read
  pages: write
  id-token: write

# Serialize deploys; never cancel a publish that is already running.
concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.inputs.branch || github.ref }}
          # showLastUpdateTime reads git history, so the full log is required.
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v5.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: docs/package-lock.json

      - name: Install dependencies
        working-directory: docs
        run: npm ci

      # `docusaurus build` fails on broken links, so this step also gates the
      # docs. Output goes to docs/build (baseUrl is "/").
      - name: Build
        working-directory: docs
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: 'docs/build'

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5.0.0
