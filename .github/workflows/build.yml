name: Build-nightly
on:
  push:
    branches: ['nightly']

# Least privilege: this workflow only reads the repository — it pushes to a
# registry, not to GitHub. Without this it inherited the repository default.
permissions:
  contents: read

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      -
        name: Set up QEMU
        uses: docker/setup-qemu-action@v4.2.0
      -
        name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.3.0
      -
        name: Login to DockerHub
        uses: docker/login-action@v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      -
        name: Build and push
        uses: docker/build-push-action@v7.3.0
        with:
          push: true
          file: "./Dockerfile"
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          build-args: |
            appVersion=nightly
          tags: |
            "${{vars.BUILDKIT_IMAGE}}:nightly"

