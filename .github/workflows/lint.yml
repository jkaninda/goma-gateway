name: Lint

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    name: Run on Ubuntu
    runs-on: ubuntu-latest
    steps:
      - name: Clone the code
        uses: actions/checkout@v7.0.1

      - name: Setup Go
        uses: actions/setup-go@v7.0.0
        with:
          # One source of truth for the Go version across every workflow.
          go-version-file: go.mod

      - name: Run linter
        uses: golangci/golangci-lint-action@v9.3.0
        with:
          version: v2.9.0
