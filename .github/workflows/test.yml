name: Tests

on:
  push:
    branches:
      - main
      - nightly
  pull_request:
    branches:
      - main
env:
  IMAGE_NAME: goma-gateway

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7

    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version: '1.26'

    - name: Test
      run: go test -v ./...

    - name: Build
      run: go build -v ./...