name: Tests

on:
  push:
    branches:
      - main
      - nightly
  pull_request:
    branches:
      - main
permissions:
  contents: read

env:
  IMAGE_NAME: goma-gateway

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

    - name: Set up Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
      with:
        go-version-file: go.mod

    # -race, because this is a gateway with a hot-reload path, a shared health
    # registry and a mutable middleware registry. The audit found three data
    # races by reading; the detector is what keeps them fixed.
    - name: Test
      run: go test -race -v ./internal/... ./pkg/... ./util/...

    - name: Build
      run: go build -v ./internal/... ./pkg/... ./util/... .

    - name: Vet
      run: go vet ./internal/... ./pkg/... ./util/...

  # Supply-chain and static analysis. The audit could not run these — the
  # sandbox had no toolchain download — so there is no CVE data behind it.
  security:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

    - name: Set up Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
      with:
        go-version-file: go.mod

    - name: govulncheck
      run: |
        go install golang.org/x/vuln/cmd/govulncheck@latest
        govulncheck ./internal/... ./pkg/... ./util/... .