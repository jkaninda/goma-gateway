version: 2
updates:
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
  # Every action is pinned to an exact release (vX.Y.Z) rather than a floating
  # major tag, so a run always uses the version recorded here. Dependabot is
  # what keeps those pins from going stale.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
