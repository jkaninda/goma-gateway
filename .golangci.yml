version: "2"
run:
  allow-parallel-runners: true
linters:
  default: none
  enable:
    - copyloopvar
    - dupl
    - errcheck
    - ginkgolinter
    - goconst
    - gocyclo
    - gosec
    - govet
    - ineffassign
    - lll
    - misspell
    - nakedret
    - prealloc
    - revive
    - staticcheck
    - unconvert
    - unparam
    - unused
  settings:
    gosec:
      # Every rule below was reviewed against this codebase and is structurally
      # inapplicable or deliberate. Everything else gosec reports is a real
      # finding and should fail the build.
      #
      # Only rule IDs this golangci-lint release knows about may appear here —
      # `config verify` validates them against a fixed enum, so an ID from a
      # newer gosec fails the whole run. Newer rules are suppressed by ID in
      # exclusions.rules below instead, which is not schema-checked.
      excludes:
        # G101: constant *names* like GomaAccessToken; no credential is
        # hardcoded.
        - G101
        # G304: a gateway reads the config, certificate and JWKS paths it is
        # told to read. The paths come from configuration, not from requests.
        - G304
        # G306: file modes are set deliberately and reviewed (0600 for anything
        # holding secrets); the rule flags every literal mode.
        - G306
        # G401/G501/G505: md5 and sha1 implement the htpasswd $apr1$/$1$ and
        # {SHA} formats. They are password *verification* of existing hashes,
        # not a choice of digest for new material.
        - G401
        - G501
        - G505
        # G402: InsecureSkipVerify is a documented per-route/per-provider
        # option. Every site is driven by an explicit configuration field.
        - G402
        # G404: math/rand is used only for weighted load balancing and
        # analytics sampling; crypto/rand is used everywhere security-relevant.
        - G404
        # G115: conversions of bounded counts (backend counts, port numbers).
        - G115
    revive:
      rules:
        - name: comment-spacings
  exclusions:
    generated: lax
    rules:
      # gosec rules newer than the pinned golangci-lint's config schema, matched
      # by the ID gosec prints rather than declared in settings.gosec.excludes
      # (see the note there). Reviewed the same way as the list above:
      #   G117  the sealed session struct's token fields, not a hardcoded secret
      #   G124  cookie attributes are built from configuration at runtime
      #   G705  the redirect middlewares exist to redirect, and the Host used to
      #         build one is validated against the route's configured hosts
      #   G710  the error interceptor exists to relay upstream bodies
      - linters:
          - gosec
        text: '^G(117|124|705|710):'
      - linters:
          - dupl
          - lll
        path: pkg/*
      - linters:
          - dupl
          - lll
        path: internal/*
      # Test fixtures use predictable credentials and hosts on purpose, and a
      # table-driven test repeats literals by design — hoisting "GET" or
      # "https://example.com" into a constant makes the case harder to read,
      # not easier.
      - linters:
          - gosec
          - goconst
        path: _test\.go
    paths:
      - third_party$
      - builtin$
      - examples$
formatters:
  enable:
    - gofmt
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
